name: event-app

services:
    app:
        dns:
            - 8.8.8.8
            - 2001:4860:4860::8888
        build:
            context: .
            dockerfile: Dockerfile
        # Keep the container alive; we run `pnpm dev`, tests, etc. interactively
        # from a shell (VS Code terminal or `docker compose exec`).
        command: >
            bash -c "
                sudo chown node:node /workspace/node_modules
                ${PNPM_STORE_DIR} 2>/dev/null || true &&
                sleep infinity
            "
        init: true
        user: node
        working_dir: /workspace

        volumes:
            - .:/workspace:cached
            - node_modules:/workspace/node_modules
            - pnpm_store:/home/node/.local/share/pnpm/store

        ports:
            - "5173:5173" # Vite

        env_file:
            - path: .env
              required: false

        environment:
            NODE_ENV: development
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"

volumes:
    node_modules:
    pnpm_store:

networks:
    default:
        driver: bridge
        enable_ipv6: true
        driver_opts:
            com.docker.network.driver.mtu: "1280"
        ipam:
            config:
                - subnet: "fd01::/64"
