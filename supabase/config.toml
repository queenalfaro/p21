# =============================================================================
# Supabase project config.
#
# Created by `supabase init` and hand-edited for this project.
# This file is committed; secrets live in env vars and Supabase dashboard.
#
# `project_id` is a *local* label — the link to a cloud project is stored
# separately in `supabase/.temp/` (gitignored) after `supabase link`.
# =============================================================================

project_id = "event-app"


# -----------------------------------------------------------------------------
# API gateway (PostgREST + GraphQL). Only used for local `supabase start`.
# -----------------------------------------------------------------------------
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000


# -----------------------------------------------------------------------------
# Database. `major_version` MUST match what the cloud project runs, otherwise
# migrations may behave differently. Supabase cloud is on Postgres 17.
# -----------------------------------------------------------------------------
[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
# Files in supabase/migrations/*.sql are applied in lexicographic order.
enabled = true


# -----------------------------------------------------------------------------
# Supabase Studio (local dashboard for `supabase start`).
# -----------------------------------------------------------------------------
[studio]
enabled = true
port = 54323


# -----------------------------------------------------------------------------
# Auth.
# Most of these settings only take effect locally — they DO NOT push to the
# cloud project automatically. Set the same values in the Supabase dashboard
# (Authentication → Providers / Settings) for dev and prod.
# -----------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Required by the spec ("Анонимный вход — только имя").
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# DEV ergonomics: skip email confirmation. ALWAYS turn this ON in prod via dashboard.
enable_confirmations = false
max_frequency = "1s"


# -----------------------------------------------------------------------------
# Storage.
# -----------------------------------------------------------------------------
[storage]
enabled = true
# 5 MB caps the avatars bucket usage to something sensible on the free tier.
file_size_limit = "5MiB"


# -----------------------------------------------------------------------------
# Realtime.
# -----------------------------------------------------------------------------
[realtime]
enabled = true


# -----------------------------------------------------------------------------
# Edge Functions — not used yet. Flip to `true` and add `[functions.<name>]`
# blocks when you start writing Deno functions.
# -----------------------------------------------------------------------------
[edge_runtime]
enabled = false
